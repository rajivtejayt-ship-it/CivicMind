# Firebase App Hosting configuration for CivicMind
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Cloud Run instance configuration
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  minInstances: 0
  maxInstances: 3

env:
  # ── Firebase (client-safe — already public in browser bundle) ──────────────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBFCHMaXJZrjIXEX_sjM0ihT9xKwiv93kQ
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: civicmind-vibe2ship.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: civicmind-vibe2ship
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: civicmind-vibe2ship.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "945478220859"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:945478220859:web:2115e929f5c0a64041b01e
    availability:
      - BUILD
      - RUNTIME

  # ── Gemini API Key (server-side secret — stored in Secret Manager) ─────────
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
